<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Binary Lab - Control ESP32</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --canvas: #f4f7f6;
      --surface: #ffffff;
      --surface-muted: #edf3f1;
      --line: #d7e2df;
      --ink: #17302e;
      --muted: #6d807d;
      --accent: #147d72;
      --accent-soft: #d9f0eb;
      --accent-strong: #0c5c54;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DM Sans", system-ui, sans-serif; }
    body {
      background: var(--canvas);
      color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      width: min(760px, 100%); padding: clamp(1.5rem, 4vw, 2.75rem);
      background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
      box-shadow: 0 18px 45px rgba(23, 48, 46, 0.08);
    }

    .display-box {
      background: var(--ink); padding: 1.5rem; margin-bottom: 2rem; border-radius: 14px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .display-caption, .panel-title { color: var(--muted); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .display-caption { margin-bottom: 0.25rem; }
    .display-box .display-caption { color: #8eb9b3; }
    .display-val { font-size: clamp(3.5rem, 10vw, 5rem); line-height: 1; font-weight: 700; color: #e4faf5; font-family: "SFMono-Regular", Consolas, monospace; }

    .control-layout { display: grid; grid-template-columns: 1fr 0.9fr; gap: 2rem; text-align: left; }
    .control-panel { min-width: 0; }
    .panel-title { margin-bottom: 0.75rem; }
    .switches-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0; }
    .switch-btn {
      background: var(--surface-muted); border: 1px solid var(--line); border-radius: 10px;
      padding: 0.75rem 0.35rem; cursor: pointer; user-select: none; transition: 0.18s ease; color: var(--ink);
    }
    .switch-btn:hover { border-color: var(--accent); background: #e5f2ef; transform: translateY(-2px); }
    .switch-btn.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 5px 12px rgba(20, 125, 114, 0.12); }
    .sw-label { display: block; color: var(--muted); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .lever-track { position: relative; width: 22px; height: 48px; margin: 0 auto 0.45rem; background: #d9e3e1; border: 1px solid #c6d4d1; border-radius: 11px; }
    .lever-knob { position: absolute; left: 3px; bottom: 3px; width: 14px; height: 20px; background: #a5b8b4; border-radius: 8px; transition: transform 0.18s ease, background 0.18s ease; }
    .switch-btn.active .lever-knob { transform: translateY(-21px); background: var(--accent); }
    .sw-val { font-size: 1.25rem; font-weight: 700; color: var(--ink); }

    .binary-input { width: 100%; padding: 0.8rem; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; color: var(--ink); font: 700 1.35rem "SFMono-Regular", Consolas, monospace; letter-spacing: 0.25em; text-align: center; outline: none; transition: 0.18s ease; }
    .binary-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(20, 125, 114, 0.12); }
    .keypad { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.75rem; }
    .key-btn { padding: 0.75rem; background: var(--surface-muted); border: 1px solid var(--line); border-radius: 9px; color: var(--ink); cursor: pointer; font: 700 1.05rem "SFMono-Regular", Consolas, monospace; transition: 0.18s ease; }
    .key-btn:hover { background: var(--accent-soft); border-color: var(--accent); transform: translateY(-2px); }
    .key-btn.wide { grid-column: span 2; background: var(--accent); border-color: var(--accent); color: #fff; }
    .key-btn.wide:hover { background: var(--accent-strong); }

    .status { margin-top: 2rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); transition: color 0.3s; }
    .status.connected { color: var(--accent); }
    .status.disconnected { color: #c75b5b; }

    @media (max-width: 430px) {
      body { padding: 1rem; }
      .card { padding: 1.25rem; border-radius: 16px; }
      .control-layout { grid-template-columns: 1fr; gap: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="display-box">
      <div class="display-caption">Salida decimal</div>
      <div id="dec-val" class="display-val">0</div>
    </div>

    <div class="control-layout">
      <section class="control-panel">
        <h2 class="panel-title">Palancas binarias</h2>
        <div class="switches-grid">
      <button class="switch-btn" id="btn-sw1" onclick="toggleSwitch(0)">
        <span class="sw-label">B3</span>
        <span class="lever-track"><span class="lever-knob"></span></span>
        <div class="sw-val">0</div>
      </button>
      <button class="switch-btn" id="btn-sw2" onclick="toggleSwitch(1)">
        <span class="sw-label">B2</span>
        <span class="lever-track"><span class="lever-knob"></span></span>
        <div class="sw-val">0</div>
      </button>
      <button class="switch-btn" id="btn-sw3" onclick="toggleSwitch(2)">
        <span class="sw-label">B1</span>
        <span class="lever-track"><span class="lever-knob"></span></span>
        <div class="sw-val">0</div>
      </button>
      <button class="switch-btn" id="btn-sw4" onclick="toggleSwitch(3)">
        <span class="sw-label">B0</span>
        <span class="lever-track"><span class="lever-knob"></span></span>
        <div class="sw-val">0</div>
      </button>
        </div>
      </section>

      <section class="control-panel">
        <h2 class="panel-title">Teclado binario</h2>
        <input id="binary-input" class="binary-input" maxlength="4" inputmode="numeric" pattern="[01]*" placeholder="0000" aria-label="Ingresar número binario" oninput="actualizarDesdeBinario(this.value)">
        <div class="keypad">
          <button class="key-btn" onclick="teclaBinaria('0')">0</button>
          <button class="key-btn" onclick="teclaBinaria('1')">1</button>
          <button class="key-btn" onclick="borrarBinario()">Borrar</button>
        </div>
      </section>
    </div>

    <p class="status" id="status">Conectando...</p>
  </div>

  <script>
    const TOPIC_PUB = 'wokwi/esp32/binary_lab_cmd';
    const TOPIC_SUB = 'wokwi/esp32/binary_lab_switches';
    
    let currentBits = [0, 0, 0, 0]; // b3, b2, b1, b0
    let isConnected = false;
    const statusEl = document.getElementById('status');

    function setConnected() {
      isConnected = true;
      statusEl.innerText = 'Conectado';
      statusEl.className = 'status connected';
    }

    function setDisconnected() {
      isConnected = false;
      statusEl.innerText = 'No Conectado';
      statusEl.className = 'status disconnected';
    }

    // Si después de 4 segundos no logra conectar, mostrar "No Conectado"
    const connectionTimeout = setTimeout(() => {
      if (!isConnected) {
        setDisconnected();
      }
    }, 4000);

    let client;
    try {
      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        connectTimeout: 4000,
        reconnectPeriod: 3000
      });

      client.on('connect', () => {
        clearTimeout(connectionTimeout);
        setConnected();
        client.subscribe(TOPIC_SUB);
      });

      client.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data.decimal !== undefined) {
            document.getElementById('dec-val').innerText = data.decimal;
          }
          if (data.b3 !== undefined) {
            currentBits = [data.b3, data.b2, data.b1, data.b0];
            actualizarUI();
          }
        } catch (e) {}
      });

      client.on('error', () => {
        setDisconnected();
      });

      client.on('offline', () => {
        setDisconnected();
      });

      client.on('close', () => {
        if (!isConnected) {
          setDisconnected();
        }
      });
    } catch (err) {
      setDisconnected();
    }

    // Soporte adicional para polling HTTP si se sirve desde el servidor web de Wokwi
    async function checkHttpBackend() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1500);
        const res = await fetch('/data', { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const d = await res.json();
          document.getElementById('dec-val').innerText = d.dec > 9 ? '-' : d.dec;
          currentBits = [d.b3, d.b2, d.b1, d.b0];
          actualizarUI();
          setConnected();
          return true;
        }
      } catch (e) {}
      return false;
    }

    const isWokwiBackend = window.location.hostname.includes('wokwi');
    if (isWokwiBackend) {
      setInterval(async () => {
        const ok = await checkHttpBackend();
        if (!ok && !isConnected) {
          setDisconnected();
        }
      }, 1000);
    }

    function actualizarUI() {
      const binaryInput = document.getElementById('binary-input');
      if (binaryInput && document.activeElement !== binaryInput) {
        binaryInput.value = currentBits.join('');
      }
      currentBits.forEach((val, i) => {
        const btn = document.getElementById(`btn-sw${i+1}`);
        if (btn) {
          btn.querySelector('.sw-val').innerText = val;
          if (val === 1) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
    }

    function toggleSwitch(index) {
      currentBits[index] = currentBits[index] === 1 ? 0 : 1;
      actualizarUI();
      enviarComando();
    }

    function actualizarDesdeBinario(value) {
      const cleanValue = value.replace(/[^01]/g, '').slice(0, 4);
      const binaryInput = document.getElementById('binary-input');
      binaryInput.value = cleanValue;
      if (cleanValue) {
        currentBits = cleanValue.padStart(4, '0').split('').map(Number);
        actualizarUI();
        enviarComando();
      }
    }

    function teclaBinaria(bit) {
      const binaryInput = document.getElementById('binary-input');
      actualizarDesdeBinario((binaryInput.value + bit).slice(-4));
    }

    function borrarBinario() {
      const binaryInput = document.getElementById('binary-input');
      actualizarDesdeBinario(binaryInput.value.slice(0, -1));
    }

    function enviarComando() {
      const payload = JSON.stringify({
        b3: currentBits[0],
        b2: currentBits[1],
        b1: currentBits[2],
        b0: currentBits[3]
      });
      if (client && client.connected) {
        client.publish(TOPIC_PUB, payload);
      }
    }
  </script>
</body>
</html>
